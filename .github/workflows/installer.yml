name: Build review installer
on:
  workflow_dispatch:
    inputs:
      sign_updates:
        description: 'Create signed updater artifacts (requires TAURI_SIGNING_PRIVATE_KEY secret)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install chromium
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: node ../scripts/third-party-notices.mjs
      - if: ${{ !inputs.sign_updates }}
        run: npm run tauri build -- --bundles nsis
      - name: Build signed update for review
        if: ${{ inputs.sign_updates }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the updater signing secret first.' }
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../scripts/update-manifest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one signed installer.' }
          $env:GAMEZIP_TEST_INSTALLER = $installer[0].FullName
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib updater::tests::built_installer_signature -- --ignored
      - name: Write installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installers[0].Name)" | Set-Content -Encoding utf8 src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GameZip-unsigned-review-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
